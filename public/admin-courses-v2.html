<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의 관리 v2 — 타닥클래스 관리자</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css?v=10" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <style>
    body { background: var(--bg-muted, #f5f6f8); }
    .cv2-wrap { max-width: 1040px; margin: 0 auto; padding: 32px 24px 80px; }
    .cv2-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cv2-topbar h1 { font-size: 20px; font-weight: 800; margin: 0; }
    .cv2-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #eef2ff; color: #4338ca; margin-left: 8px; vertical-align: middle; }
    .cv2-section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
    .cv2-section h2 { font-size: 15px; font-weight: 700; margin: 0 0 14px; color: #111; }
    .cv2-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
    .cv2-field { flex: 1; min-width: 200px; }
    .cv2-field label { display: block; font-size: 12.5px; font-weight: 600; color: #555; margin-bottom: 5px; }
    .cv2-field input[type=text], .cv2-field input[type=number], .cv2-field input[type=url],
    .cv2-field input[type=datetime-local], .cv2-field select, .cv2-field textarea {
      width: 100%; padding: 9px 11px; border: 1px solid #dcdfe4; border-radius: 8px; font-size: 13.5px; box-sizing: border-box; font-family: inherit;
    }
    .cv2-field textarea { resize: vertical; min-height: 60px; }
    .cv2-hint { font-size: 11.5px; color: #999; margin-top: 3px; }
    .cv2-check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
    .cv2-thumb-preview { width: 140px; height: 90px; border-radius: 8px; background: #f0f0f0 center/cover no-repeat; border: 1px solid #e0e0e0; margin-bottom: 8px; }
    .cv2-hidden { display: none !important; }
    .cv2-list-table th, .cv2-list-table td { font-size: 13px; }
    .cv2-status { font-size: 13px; color: #e74c3c; margin-top: 10px; }
    .cv2-chapter-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .cv2-chapter-row:last-child { border-bottom: none; }
    .cv2-chapter-title { flex: 1; font-size: 13.5px; }
    .cv2-image-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .cv2-image-item { position: relative; width: 90px; height: 90px; border-radius: 8px; background: #f0f0f0 center/cover no-repeat; border: 1px solid #e0e0e0; }
    .cv2-image-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #e74c3c; color: #fff; border: none; font-size: 12px; cursor: pointer; line-height: 20px; }
  </style>
</head>
<body>
  <div class="cv2-wrap">
    <div class="cv2-topbar">
      <h1>강의 관리 <span class="cv2-badge">v2 (재설계)</span></h1>
      <div>
        <a href="/admin.html" class="btn-sm" style="text-decoration:none;padding:8px 14px;border:1px solid #ddd;border-radius:8px;color:#555">← 기존 관리자로</a>
      </div>
    </div>

    <!-- ===== 목록 화면 ===== -->
    <div id="cv2-view-list">
      <div class="cv2-section">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">강의 목록</h2>
          <button class="btn-save" style="margin:0" onclick="cv2ShowEditor(null)"><i class="ti ti-plus"></i> 새 강의</button>
        </div>
        <div id="cv2-list-body" style="margin-top:14px">불러오는 중...</div>
      </div>
    </div>

    <!-- ===== 편집 화면 ===== -->
    <div id="cv2-view-editor" class="cv2-hidden">
      <button class="btn-sm" style="margin-bottom:14px;padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer" onclick="cv2ShowList()">← 목록으로</button>

      <div class="cv2-section">
        <h2>기본 정보</h2>
        <div class="cv2-row">
          <div class="cv2-field" style="flex:2"><label>강의 제목 *</label><input type="text" id="f-title"></div>
          <div class="cv2-field"><label>카테고리 *</label><input type="text" id="f-category" placeholder="예: 캡컷 PRO"></div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field" style="flex:1 1 100%"><label>설명</label><textarea id="f-description" rows="2"></textarea></div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field"><label>배지 텍스트</label><input type="text" id="f-badge" placeholder="예: LIVE, NEW"></div>
          <div class="cv2-field"><label>정렬 순서</label><input type="number" id="f-sort-order" value="999"></div>
          <div class="cv2-field" style="display:flex;align-items:flex-end">
            <label class="cv2-check"><input type="checkbox" id="f-is-published"> 공개</label>
          </div>
        </div>
      </div>

      <div class="cv2-section">
        <h2>종류 · 가격</h2>
        <div class="cv2-row">
          <div class="cv2-field">
            <label>강의 종류 *</label>
            <select id="f-kind">
              <option value="vod">VOD (녹화)</option>
              <option value="live">라이브</option>
            </select>
          </div>
          <div class="cv2-field"><label>판매가(원)</label><input type="number" id="f-price" value="0"></div>
          <div class="cv2-field"><label>정가(취소선 표시용, 선택)</label><input type="number" id="f-list-price"></div>
          <div class="cv2-field" style="display:flex;align-items:flex-end">
            <label class="cv2-check"><input type="checkbox" id="f-is-offline"> 오프라인 강의</label>
          </div>
        </div>
      </div>

      <div class="cv2-section cv2-hidden" id="cv2-live-section">
        <h2>라이브 설정</h2>
        <div class="cv2-row">
          <div class="cv2-field"><label>시작 일시 *</label><input type="datetime-local" id="f-live-starts"></div>
          <div class="cv2-field"><label>종료 일시</label><input type="datetime-local" id="f-live-ends"></div>
          <div class="cv2-field">
            <label>진행 상태</label>
            <select id="f-live-status"><option value="upcoming">예정</option><option value="ended">종료(수동)</option></select>
          </div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field"><label>일정 표시 문구</label><input type="text" id="f-live-schedule-label" placeholder="예: 2026.9.1(화) 오후 8시"></div>
          <div class="cv2-field"><label>Google Meet 코드</label><input type="text" id="f-meet-code"></div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field"><label>단톡방 링크</label><input type="url" id="f-live-chat-url"></div>
          <div class="cv2-field"><label>다시보기 링크</label><input type="url" id="f-live-replay-url"></div>
          <div class="cv2-field"><label>자료 다운로드 링크</label><input type="url" id="f-live-material-url"></div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field" style="flex:1 1 100%"><label>커리큘럼 소개 텍스트</label><textarea id="f-live-curriculum-text" rows="2"></textarea></div>
        </div>
      </div>

      <div class="cv2-section">
        <h2>미디어</h2>
        <div class="cv2-row">
          <div class="cv2-field">
            <label>썸네일</label>
            <div class="cv2-thumb-preview" id="cv2-thumb-preview"></div>
            <input type="file" id="f-thumb-file" accept="image/jpeg,image/png,image/webp">
            <input type="url" id="f-thumbnail-url" placeholder="또는 이미지 URL 직접 입력" style="margin-top:6px">
          </div>
          <div class="cv2-field">
            <label>썸네일 아이콘 클래스 (이미지 없을 때 폴백)</label>
            <input type="text" id="f-thumbnail-icon" placeholder="예: ti-video">
            <label style="margin-top:10px">카드 스타일</label>
            <select id="f-thumb-style"><option value="light">라이트</option><option value="dark">다크</option></select>
          </div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field" style="flex:1 1 100%">
            <label>상세 소개 본문</label>
            <textarea id="f-detail-intro-text" rows="3"></textarea>
            <label style="margin-top:10px">상세 소개 이미지 (WebP, 최대 30장)</label>
            <input type="file" id="f-detail-images-file" accept="image/webp,image/jpeg,image/png" multiple>
            <div class="cv2-image-list" id="cv2-detail-images"></div>
          </div>
        </div>
      </div>

      <div class="cv2-section">
        <h2>체크아웃 · 결제</h2>
        <div class="cv2-row">
          <div class="cv2-field">
            <label>결제 방식</label>
            <select id="f-checkout-provider"><option value="site">사이트(무료/쿠폰만)</option><option value="smartstore">네이버 스마트스토어</option></select>
          </div>
          <div class="cv2-field"><label>수강 정원 (0=무제한)</label><input type="number" id="f-enrollment-limit" value="0"></div>
          <div class="cv2-field" style="display:flex;align-items:flex-end">
            <label class="cv2-check"><input type="checkbox" id="f-coupon-allowed" checked> 쿠폰 적용 허용</label>
          </div>
        </div>
        <div class="cv2-row" id="cv2-smartstore-fields">
          <div class="cv2-field"><label>정가(쿠폰 없음) 링크 *</label><input type="url" id="f-store-url-none"></div>
          <div class="cv2-field"><label>10% 할인 링크</label><input type="url" id="f-store-url-10"></div>
          <div class="cv2-field"><label>20% 할인 링크</label><input type="url" id="f-store-url-20"></div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field"><label>결제 시작</label><input type="datetime-local" id="f-checkout-starts"></div>
          <div class="cv2-field"><label>결제 마감</label><input type="datetime-local" id="f-checkout-ends"></div>
        </div>
      </div>

      <div class="cv2-section">
        <h2>커리큘럼 소개 콘텐츠</h2>
        <div class="cv2-row">
          <div class="cv2-field"><label>학습 성과 (줄바꿈으로 구분)</label><textarea id="f-learning-outcomes" rows="3"></textarea></div>
          <div class="cv2-field"><label>수강 대상 (줄바꿈으로 구분)</label><textarea id="f-target-audience" rows="3"></textarea></div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field"><label>강사명</label><input type="text" id="f-instructor-name"></div>
          <div class="cv2-field"><label>강사 직함</label><input type="text" id="f-instructor-role"></div>
        </div>
        <div class="cv2-row">
          <div class="cv2-field" style="flex:1 1 100%"><label>강사 소개</label><textarea id="f-instructor-bio" rows="2"></textarea></div>
        </div>
      </div>

      <div class="cv2-section" id="cv2-chapters-section">
        <h2>챕터 <span style="font-weight:400;color:#999;font-size:12.5px">— 저장 후 관리할 수 있습니다</span></h2>
        <div id="cv2-chapters-body"><p style="color:#aaa;font-size:13px">먼저 강의를 저장해주세요.</p></div>
      </div>

      <p id="cv2-status" class="cv2-status"></p>
      <button class="btn-save" id="cv2-save-btn" onclick="cv2Save()"><i class="ti ti-check"></i> 저장</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="/js/utils/dom.js?v=1"></script>
  <script src="/js/admin/utils.js?v=1"></script>
  <script src="/js/admin/images.js?v=1"></script>
  <script src="/js/admin/boot.js?v=1"></script>
  <script src="/js/admin/auth.js?v=2"></script>
  <script>
    let cv2Courses = []
    let cv2EditingId = null
    let cv2ThumbState = null
    let cv2DetailImages = []

    function $(id) { return document.getElementById(id) }

    function cv2ShowList() {
      $('cv2-view-editor').classList.add('cv2-hidden')
      $('cv2-view-list').classList.remove('cv2-hidden')
      cv2LoadList()
    }

    function cv2ShowEditor(course) {
      cv2EditingId = course ? course.id : null
      cv2ThumbState = null
      cv2DetailImages = []
      cv2ResetForm()
      if (course) cv2FillForm(course)
      $('cv2-view-list').classList.add('cv2-hidden')
      $('cv2-view-editor').classList.remove('cv2-hidden')
      cv2SyncKindFields()
      cv2SyncCheckoutFields()
      renderThumbPreview()
      renderDetailImages()
      if (course) cv2LoadChapters(course.id)
      else $('cv2-chapters-body').innerHTML = '<p style="color:#aaa;font-size:13px">먼저 강의를 저장해주세요.</p>'
    }

    function cv2ResetForm() {
      const ids = ['f-title', 'f-category', 'f-description', 'f-badge', 'f-price', 'f-list-price',
        'f-live-starts', 'f-live-ends', 'f-live-schedule-label', 'f-meet-code',
        'f-live-chat-url', 'f-live-replay-url', 'f-live-material-url', 'f-live-curriculum-text',
        'f-thumbnail-icon', 'f-thumbnail-url', 'f-detail-intro-text',
        'f-store-url-none', 'f-store-url-10', 'f-store-url-20',
        'f-checkout-starts', 'f-checkout-ends', 'f-learning-outcomes', 'f-target-audience',
        'f-instructor-name', 'f-instructor-role', 'f-instructor-bio']
      ids.forEach(id => { if ($(id)) $(id).value = '' })
      $('f-sort-order').value = 999
      $('f-is-published').checked = false
      $('f-kind').value = 'vod'
      $('f-is-offline').checked = false
      $('f-live-status').value = 'upcoming'
      $('f-thumb-style').value = 'light'
      $('f-checkout-provider').value = 'site'
      $('f-enrollment-limit').value = 0
      $('f-coupon-allowed').checked = true
      $('cv2-status').textContent = ''
    }

    function cv2FillForm(c) {
      $('f-title').value = c.title || ''
      $('f-category').value = c.category || ''
      $('f-description').value = c.description || ''
      $('f-badge').value = c.badge || ''
      $('f-sort-order').value = c.sort_order ?? 999
      $('f-is-published').checked = !!c.is_published
      $('f-kind').value = c.kind || 'vod'
      $('f-price').value = c.price || 0
      $('f-list-price').value = c.list_price ?? ''
      $('f-is-offline').checked = !!c.is_offline
      $('f-live-starts').value = toLocalInput(c.live_starts_at)
      $('f-live-ends').value = toLocalInput(c.live_ends_at)
      $('f-live-status').value = c.live_status || 'upcoming'
      $('f-live-schedule-label').value = c.live_schedule_label || ''
      $('f-meet-code').value = c.meet_code || ''
      $('f-live-chat-url').value = c.live_chat_url || ''
      $('f-live-replay-url').value = c.live_replay_url || ''
      $('f-live-material-url').value = c.live_material_url || ''
      $('f-live-curriculum-text').value = c.live_curriculum_text || ''
      $('f-thumbnail-url').value = c.thumbnail_url || ''
      $('f-thumbnail-icon').value = c.thumbnail_icon || ''
      $('f-thumb-style').value = c.thumb_style || 'light'
      $('f-detail-intro-text').value = c.detail_intro_text || ''
      cv2DetailImages = (c.detail_intro_images || []).map(url => ({ url, preview: url }))
      $('f-checkout-provider').value = c.checkout_provider || 'site'
      $('f-store-url-none').value = c.store_checkout_urls?.none || ''
      $('f-store-url-10').value = c.store_checkout_urls?.discount_10 || ''
      $('f-store-url-20').value = c.store_checkout_urls?.discount_20 || ''
      $('f-checkout-starts').value = toLocalInput(c.checkout_starts_at)
      $('f-checkout-ends').value = toLocalInput(c.checkout_ends_at)
      $('f-coupon-allowed').checked = c.coupon_allowed !== false
      $('f-enrollment-limit').value = c.enrollment_limit || 0
      $('f-learning-outcomes').value = (c.learning_outcomes || []).join('\n')
      $('f-target-audience').value = (c.target_audience || []).join('\n')
      $('f-instructor-name').value = c.instructor_name || ''
      $('f-instructor-role').value = c.instructor_role || ''
      $('f-instructor-bio').value = c.instructor_bio || ''
    }

    function toLocalInput(iso) {
      if (!iso) return ''
      const d = new Date(iso)
      if (Number.isNaN(d.getTime())) return ''
      const pad = n => String(n).padStart(2, '0')
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`
    }
    function toIsoFromLocal(value) {
      if (!value) return null
      const d = new Date(value)
      return Number.isNaN(d.getTime()) ? null : d.toISOString()
    }
    function splitLines(value) {
      return String(value || '').split('\n').map(s => s.trim()).filter(Boolean)
    }

    function cv2SyncKindFields() {
      const isLive = $('f-kind').value === 'live'
      $('cv2-live-section').classList.toggle('cv2-hidden', !isLive)
    }
    function cv2SyncCheckoutFields() {
      const isSmartstore = $('f-checkout-provider').value === 'smartstore'
      $('cv2-smartstore-fields').classList.toggle('cv2-hidden', !isSmartstore)
    }

    function renderThumbPreview() {
      const box = $('cv2-thumb-preview')
      const src = cv2ThumbState?.preview || $('f-thumbnail-url')?.value.trim() || ''
      box.style.backgroundImage = src ? `url("${src.replace(/"/g, '%22')}")` : ''
    }
    function renderDetailImages() {
      const list = $('cv2-detail-images')
      list.innerHTML = cv2DetailImages.map((item, i) => `
        <div class="cv2-image-item" style="background-image:url('${String(item.preview).replace(/'/g, '%27')}')">
          <button type="button" class="cv2-image-remove" onclick="cv2RemoveDetailImage(${i})">&times;</button>
        </div>
      `).join('')
    }
    function cv2RemoveDetailImage(i) {
      cv2DetailImages.splice(i, 1)
      renderDetailImages()
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader()
        reader.onload = () => resolve(reader.result)
        reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'))
        reader.readAsDataURL(file)
      })
    }
    function dataUrlToBlob(dataUrl) {
      const [header, data] = String(dataUrl || '').split(',')
      const mime = (header.match(/data:([^;]+)/) || [])[1] || 'image/jpeg'
      const bin = atob(data)
      const arr = new Uint8Array(bin.length)
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i)
      return new Blob([arr], { type: mime })
    }
    async function uploadBlob(blob, kind, courseId) {
      const ext = blob.type === 'image/webp' ? 'webp' : blob.type === 'image/png' ? 'png' : 'jpg'
      const file = new File([blob], `upload.${ext}`, { type: blob.type || 'image/jpeg' })
      const data = await API.upload('/admin/uploads', file, { kind, course_id: courseId || 'draft' })
      return data.url
    }

    $('f-thumb-file').addEventListener('change', async (e) => {
      const file = e.target.files?.[0]
      e.target.value = ''
      if (!file) return
      try {
        const preview = await readFileAsDataUrl(file)
        cv2ThumbState = { file, preview }
        $('f-thumbnail-url').value = ''
        renderThumbPreview()
      } catch (err) { alert(err.message) }
    })
    $('f-thumbnail-url').addEventListener('input', () => { cv2ThumbState = null; renderThumbPreview() })
    $('f-detail-images-file').addEventListener('change', async (e) => {
      const files = [...(e.target.files || [])]
      e.target.value = ''
      for (const file of files) {
        if (cv2DetailImages.length >= 30) { alert('최대 30장까지 등록할 수 있습니다.'); break }
        try {
          const preview = await readFileAsDataUrl(file)
          cv2DetailImages.push({ file, preview })
        } catch (err) { alert(err.message) }
      }
      renderDetailImages()
    })

    $('f-kind').addEventListener('change', cv2SyncKindFields)
    $('f-checkout-provider').addEventListener('change', cv2SyncCheckoutFields)

    async function prepareThumbnailUrl(courseId) {
      if (cv2ThumbState?.file) {
        const dataUrl = await AdminImages.resizeUploadImage(cv2ThumbState.file, { maxWidth: 1200, maxHeight: 1200, maxBase64Len: 450000 })
        try { return await uploadBlob(dataUrlToBlob(dataUrl), 'thumbnail', courseId) }
        catch { return dataUrl }
      }
      return $('f-thumbnail-url').value.trim() || null
    }
    async function prepareDetailImageUrls(courseId) {
      const urls = []
      for (const item of cv2DetailImages) {
        if (item.url) { urls.push(item.url); continue }
        if (!item.file) continue
        const dataUrl = await AdminImages.resizeCanvasImageToWebpFromSource(item.file, { maxWidth: 1000, maxHeight: 5000, maxBase64Len: 950000 })
        try { urls.push(await uploadBlob(dataUrlToBlob(dataUrl), 'detail-intro', courseId)) }
        catch { urls.push(dataUrl) }
      }
      return urls
    }

    async function cv2Save() {
      const statusEl = $('cv2-status')
      const btn = $('cv2-save-btn')
      statusEl.textContent = ''
      const title = $('f-title').value.trim()
      const category = $('f-category').value.trim()
      if (!title) { statusEl.textContent = '제목을 입력하세요.'; return }
      if (!category) { statusEl.textContent = '카테고리를 입력하세요.'; return }

      btn.disabled = true
      btn.textContent = '저장 중...'
      try {
        const [thumbnail_url, detail_intro_images] = await Promise.all([
          prepareThumbnailUrl(cv2EditingId || 'draft'),
          prepareDetailImageUrls(cv2EditingId || 'draft'),
        ])

        const payload = {
          title, category,
          description: $('f-description').value.trim(),
          badge: $('f-badge').value.trim() || null,
          sort_order: parseInt($('f-sort-order').value, 10) || 999,
          is_published: $('f-is-published').checked,
          kind: $('f-kind').value,
          price: parseInt($('f-price').value, 10) || 0,
          list_price: $('f-list-price').value ? parseInt($('f-list-price').value, 10) : null,
          is_offline: $('f-is-offline').checked,
          thumbnail_url: thumbnail_url || null,
          thumbnail_icon: $('f-thumbnail-icon').value.trim() || null,
          thumb_style: $('f-thumb-style').value,
          detail_intro_text: $('f-detail-intro-text').value.trim() || null,
          detail_intro_images: detail_intro_images.length ? detail_intro_images : null,
          checkout_provider: $('f-checkout-provider').value,
          store_checkout_urls: {
            none: $('f-store-url-none').value.trim() || null,
            discount_10: $('f-store-url-10').value.trim() || null,
            discount_20: $('f-store-url-20').value.trim() || null,
          },
          checkout_starts_at: toIsoFromLocal($('f-checkout-starts').value),
          checkout_ends_at: toIsoFromLocal($('f-checkout-ends').value),
          coupon_allowed: $('f-coupon-allowed').checked,
          enrollment_limit: parseInt($('f-enrollment-limit').value, 10) || 0,
          learning_outcomes: splitLines($('f-learning-outcomes').value),
          target_audience: splitLines($('f-target-audience').value),
          instructor_name: $('f-instructor-name').value.trim() || null,
          instructor_role: $('f-instructor-role').value.trim() || null,
          instructor_bio: $('f-instructor-bio').value.trim() || null,
        }
        if ($('f-kind').value === 'live') {
          payload.live_starts_at = toIsoFromLocal($('f-live-starts').value)
          payload.live_ends_at = toIsoFromLocal($('f-live-ends').value)
          payload.live_status = $('f-live-status').value
          payload.live_schedule_label = $('f-live-schedule-label').value.trim() || null
          payload.meet_code = $('f-meet-code').value.trim() || null
          payload.live_chat_url = $('f-live-chat-url').value.trim() || null
          payload.live_replay_url = $('f-live-replay-url').value.trim() || null
          payload.live_material_url = $('f-live-material-url').value.trim() || null
          payload.live_curriculum_text = $('f-live-curriculum-text').value.trim() || null
        }

        let course
        if (cv2EditingId) {
          const res = await API.patch('/admin/v2/courses/' + cv2EditingId, payload)
          course = res.course
        } else {
          const res = await API.post('/admin/v2/courses', payload)
          course = res.course
        }
        cv2EditingId = course.id
        statusEl.style.color = '#16a34a'
        statusEl.textContent = '저장되었습니다.'
        cv2LoadChapters(course.id)
      } catch (e) {
        statusEl.style.color = '#e74c3c'
        statusEl.textContent = e.message || '저장 중 오류가 발생했습니다.'
      } finally {
        btn.disabled = false
        btn.textContent = '저장'
      }
    }

    // ── 챕터 ──
    async function cv2LoadChapters(courseId) {
      const body = $('cv2-chapters-body')
      body.innerHTML = '불러오는 중...'
      try {
        const res = await API.get('/admin/v2/courses/' + courseId + '/chapters')
        const chapters = res.chapters || []
        body.innerHTML = (chapters.length ? chapters.map((ch, i) => `
          <div class="cv2-chapter-row">
            <span class="cv2-chapter-title">${i + 1}. ${esc(ch.title)} ${ch.is_free ? '<span style="color:#16a34a;font-size:11px">(무료)</span>' : ''}</span>
            <button class="btn-sm" onclick="cv2MoveChapter('${ch.id}','up')" style="padding:4px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">↑</button>
            <button class="btn-sm" onclick="cv2MoveChapter('${ch.id}','down')" style="padding:4px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">↓</button>
            <button class="btn-sm" onclick="cv2DeleteChapter('${ch.id}')" style="padding:4px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#e74c3c;cursor:pointer">삭제</button>
          </div>
        `).join('') : '<p style="color:#aaa;font-size:13px">챕터가 없습니다.</p>') + `
          <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
            <input type="text" id="cv2-new-chapter-title" placeholder="새 챕터 제목" style="flex:1;min-width:160px;padding:8px 10px;border:1px solid #ddd;border-radius:8px">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="cv2-new-chapter-free"> 무료 공개</label>
            <button class="btn-sm" onclick="cv2AddChapter('${courseId}')" style="padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer">추가</button>
          </div>`
      } catch (e) {
        body.innerHTML = `<p style="color:#e74c3c;font-size:13px">오류: ${e.message}</p>`
      }
    }
    async function cv2AddChapter(courseId) {
      const title = $('cv2-new-chapter-title').value.trim()
      if (!title) return
      try {
        await API.post('/admin/v2/courses/' + courseId + '/chapters', { title, is_free: $('cv2-new-chapter-free').checked })
        cv2LoadChapters(courseId)
      } catch (e) { alert(e.message) }
    }
    async function cv2MoveChapter(chapterId, direction) {
      try {
        await API.post('/admin/v2/courses/chapters/' + chapterId + '/move', { direction })
        cv2LoadChapters(cv2EditingId)
      } catch (e) { alert(e.message) }
    }
    async function cv2DeleteChapter(chapterId) {
      if (!confirm('이 챕터를 삭제하시겠습니까?')) return
      try {
        await API.del('/admin/v2/courses/chapters/' + chapterId)
        cv2LoadChapters(cv2EditingId)
      } catch (e) { alert(e.message) }
    }

    // ── 목록 ──
    async function cv2LoadList() {
      const body = $('cv2-list-body')
      body.innerHTML = '불러오는 중...'
      try {
        cv2Courses = await API.get('/admin/v2/courses')
        if (!cv2Courses.length) { body.innerHTML = '<p style="color:#aaa;font-size:13px">등록된 강의가 없습니다.</p>'; return }
        body.innerHTML = `<table class="data-table cv2-list-table" style="width:100%">
          <thead><tr><th>제목</th><th>종류</th><th>가격</th><th>공개</th><th></th></tr></thead>
          <tbody>${cv2Courses.map(c => `
            <tr>
              <td>${esc(c.title)}</td>
              <td>${c.kind === 'live' ? '라이브' : 'VOD'}</td>
              <td>${c.price ? '₩' + Number(c.price).toLocaleString() : '무료'}</td>
              <td>${c.is_published ? '공개' : '비공개'}</td>
              <td><button class="btn-sm" onclick="cv2EditById('${c.id}')" style="padding:6px 12px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">편집</button></td>
            </tr>
          `).join('')}</tbody>
        </table>`
      } catch (e) {
        body.innerHTML = `<p style="color:#e74c3c;font-size:13px">오류: ${e.message}</p>`
      }
    }
    function cv2EditById(id) {
      const course = cv2Courses.find(c => c.id === id)
      if (course) cv2ShowEditor(course)
    }

    ;(async function boot() {
      const ok = await AdminAuth.guardAdminAccess({ next: '/admin-courses-v2.html' })
      if (!ok) return
      cv2LoadList()
    })()
  </script>
</body>
</html>
